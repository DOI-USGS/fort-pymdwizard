name: pymdwizard
channels:
  - conda-forge
dependencies:
  - python=3.13.11 
  - pip
  - cryptography
  - numpy
  - pandas
  - geopandas
  - git
  - gdal
  - habanero=2.4.0
  - matplotlib
  - folium
  - fiona
  - shapely
  - pyproj
  - lxml
  - openpyxl
  - jupyterlab
  - ipywidgets
  - scikit-learn
  - requests
  - beautifulsoup4
  - pyyaml
  - pyqt=5.15.11
  - pyqtwebengine=5.15.11
  # Test dependencies
  - pytest
  - pytest-qt
  - pytest-mock
  - pytest-cov
  - pip:
      - sciencebasepy
      - pip-system-certs
      - GitPython
      - python-docx
      - laspy
      # Documentation build
      - sphinx>=7,<8
      - sphinx-rtd-theme>=2,<4
      - numpydoc>=1.6
